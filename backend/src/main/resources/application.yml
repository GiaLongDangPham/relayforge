spring:
  application:
    name: relayforge-backend
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public; SET TIME ZONE 'UTC'
  flyway:
    default-schema: public
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${RELAYFORGE_SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        relayforge.delivery.dispatch: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: ${RELAYFORGE_STRUCTURED_LOG_FORMAT:ecs}

relayforge:
  security:
    dashboard-origin: ${RELAYFORGE_DASHBOARD_ORIGIN:http://localhost:5173}
    secure-cookie: ${RELAYFORGE_SECURE_COOKIES:false}
    production: ${RELAYFORGE_PRODUCTION:false}
    api-key-pepper: ${RELAYFORGE_API_KEY_PEPPER}
  endpoint:
    allow-local-http: ${RELAYFORGE_ENDPOINT_ALLOW_LOCAL_HTTP:false}
  endpoint-secret:
    encryption-key: ${RELAYFORGE_ENDPOINT_ENCRYPTION_KEY}
    key-reference: ${RELAYFORGE_ENDPOINT_ENCRYPTION_KEY_REFERENCE:local-aes-gcm-v1}
  worker:
    max-in-flight-claims: 8
    initial-claim-lease: 15s
    attempt-execution-lease: 20s
    polling-interval: 500ms
    polling-jitter: 100ms
    recovery-interval: 5s
    finalization-minimum-remaining: 1s
    outbound:
      connection-timeout: 2s
      dispatch-deadline: 10s
      response-preview-bytes: 8192
  retention:
    enabled: ${RELAYFORGE_RETENTION_ENABLED:true}
    terminal-history-days: 30
    max-graphs-per-run: 25
    initial-delay: 1m
    cleanup-interval: 1h
