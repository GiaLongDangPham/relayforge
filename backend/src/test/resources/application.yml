spring:
  application:
    name: relayforge-backend
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public; SET TIME ZONE 'UTC'
  flyway:
    default-schema: public
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

relayforge:
  security:
    # This deterministic value is test-only, not a deployable publisher-secret configuration.
    dashboard-origin: http://localhost:5173
    secure-cookie: false
    production: false
    api-key-pepper: test-only-publisher-api-key-pepper-not-a-production-secret
  endpoint:
    allow-local-http: true
  endpoint-secret:
    # Base64URL of exactly 32 test-only bytes; never deploy this value.
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    key-reference: test-local-aes-gcm-v1
  worker:
    max-in-flight-claims: 8
    initial-claim-lease: 15s
    polling-interval: 500ms
    polling-jitter: 100ms
    recovery-interval: 5s
