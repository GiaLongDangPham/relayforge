spring:
  application:
    name: relayforge-backend
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public; SET TIME ZONE 'UTC'
  flyway:
    default-schema: public
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        relayforge.delivery.dispatch: true
  prometheus:
    metrics:
      export:
        enabled: true

relayforge:
  security:
    # This deterministic value is test-only, not a deployable publisher-secret configuration.
    dashboard-origin: http://localhost:5173
    secure-cookie: false
    production: false
    api-key-pepper: ${RELAYFORGE_API_KEY_PEPPER:test-only-api-key-pepper}
  endpoint:
    allow-local-http: true
  endpoint-secret:
    # Base64URL of exactly 32 test-only bytes; never deploy this value.
    encryption-key: ${RELAYFORGE_ENDPOINT_ENCRYPTION_KEY:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY}
    key-reference: test-local-aes-gcm-v1
  worker:
    max-in-flight-claims: 8
    initial-claim-lease: 15s
    attempt-execution-lease: 20s
    polling-interval: 500ms
    polling-jitter: 100ms
    recovery-interval: 5s
    outbound:
      connection-timeout: 2s
      dispatch-deadline: 10s
      response-preview-bytes: 8192
  retention:
    enabled: true
    terminal-history-days: 30
    max-graphs-per-run: 25
    initial-delay: 1m
    cleanup-interval: 1h
