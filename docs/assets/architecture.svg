<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">RelayForge architecture</title>
  <desc id="description">Publisher and owner dashboard use the API runtime. PostgreSQL stores event and delivery state. A worker claims deliveries and sends signed webhooks. Local Prometheus and Grafana scrape API and worker metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091225"/><stop offset="1" stop-color="#101f3d"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f8cff"/><stop offset="1" stop-color="#4dc8ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#85aaff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="760" fill="url(#background)" rx="28"/>
  <text x="72" y="90" fill="#f5f8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">RelayForge delivery architecture</text>
  <text x="72" y="132" fill="#a9b9d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Durable acceptance, asynchronous dispatch, and observable at-least-once recovery</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="230" width="250" height="112" rx="20" fill="#132849" stroke="#456da9" stroke-width="2"/><text x="205" y="278" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Publisher</text><text x="205" y="310" text-anchor="middle" fill="#acc4ed" font-size="18">API key + idempotency key</text>
    <rect x="80" y="465" width="250" height="112" rx="20" fill="#132849" stroke="#456da9" stroke-width="2"/><text x="205" y="513" text-anchor="middle" fill="#f5f8ff" font-size="27" font-weight="700">Owner dashboard</text><text x="205" y="545" text-anchor="middle" fill="#acc4ed" font-size="18">Session + CSRF</text>
    <rect x="500" y="330" width="275" height="140" rx="24" fill="url(#primary)"/><text x="637" y="385" text-anchor="middle" fill="#07142c" font-size="32" font-weight="800">API runtime</text><text x="637" y="418" text-anchor="middle" fill="#102752" font-size="18">Accept event + snapshot route</text><text x="637" y="445" text-anchor="middle" fill="#102752" font-size="18">one short transaction</text>
    <rect x="980" y="215" width="280" height="150" rx="24" fill="#14294a" stroke="#5f8cff" stroke-width="3"/><text x="1120" y="273" text-anchor="middle" fill="#f5f8ff" font-size="30" font-weight="800">PostgreSQL</text><text x="1120" y="308" text-anchor="middle" fill="#acc4ed" font-size="18">Events · deliveries · attempts</text><text x="1120" y="335" text-anchor="middle" fill="#acc4ed" font-size="18">idempotency · leases · history</text>
    <rect x="980" y="480" width="280" height="130" rx="24" fill="#132849" stroke="#456da9" stroke-width="2"/><text x="1120" y="533" text-anchor="middle" fill="#f5f8ff" font-size="30" font-weight="800">Worker runtime</text><text x="1120" y="568" text-anchor="middle" fill="#acc4ed" font-size="18">claim lease + token, retry</text>
    <rect x="1340" y="480" width="190" height="130" rx="24" fill="#132849" stroke="#456da9" stroke-width="2"/><text x="1435" y="533" text-anchor="middle" fill="#f5f8ff" font-size="26" font-weight="800">Webhook</text><text x="1435" y="565" text-anchor="middle" fill="#acc4ed" font-size="18">signed HTTP</text>
  </g>
  <g fill="none" stroke="#85aaff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M330 286 H500"/><path d="M330 521 H440 Q470 521 470 470 V420 Q470 400 500 400"/><path d="M775 400 H900 Q930 400 930 360 V290 Q930 290 980 290"/><path d="M1120 365 V480"/><path d="M1260 545 H1340"/><path d="M1120 480 V390"/>
  </g>
  <text x="1300" y="405" fill="#b4c5e4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">No database transaction during HTTP</text>
  <rect x="80" y="656" width="1450" height="56" rx="16" fill="#0d1b34" stroke="#304c7d" stroke-width="1"/><circle cx="118" cy="684" r="9" fill="#77d6a4"/><text x="142" y="691" fill="#cfdbef" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Local Prometheus + Grafana scrape API/worker metrics: publish latency, ready backlog, permits, and delivery outcomes.</text>
</svg>
