name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Maven test suite with Testcontainers
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build production dashboard
        run: npm run build

  container-build:
    name: Container build
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image without publishing
        run: docker build --tag relayforge-backend:ci backend
      - name: Build frontend image without publishing
        run: docker build --build-arg VITE_API_ORIGIN=http://localhost:8080 --tag relayforge-frontend:ci frontend
      - name: Build demo receiver image without publishing
        run: docker build --tag relayforge-demo-receiver:ci demo-receiver
